<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account | Trip Trek India</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#043C87;--blue:#2A6BC5;--orange:#EF3006;--ink:#13243C;--grey:#5A6B80;--line:#E3E8EF;--green:#1E8E5A;--bg:#F4F7FB;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Poppins,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
  header img{height:44px}
  header a{color:var(--navy);text-decoration:none;font-weight:600;font-size:14px}
  main{max-width:760px;margin:32px auto;padding:0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 4px 18px rgba(4,60,135,.06)}
  h1{font-size:24px;margin:0 0 4px;color:var(--navy)} .sub{color:var(--grey);font-size:14px;margin:0 0 20px}
  .tabs{display:flex;gap:8px;margin-bottom:18px}
  .tabs button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;font:600 14px Poppins;cursor:pointer;color:var(--grey)}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
  input{width:100%;padding:12px;border:1px solid #cfd8e6;border-radius:10px;font:400 15px Poppins}
  input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
  .btn{display:block;width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--orange);color:#fff;font:600 15px Poppins;cursor:pointer}
  .btn[disabled]{opacity:.6;cursor:wait}
  .link{background:none;border:0;color:var(--blue);font:600 13px Poppins;cursor:pointer;margin-top:12px;padding:0}
  .msg{margin-top:14px;font-size:14px;padding:10px 12px;border-radius:8px;display:none}
  .msg.err{display:block;background:#FDECEA;color:#B42318}
  .msg.ok{display:block;background:#E8F6EF;color:var(--green)}
  .hidden{display:none}
  .otp{letter-spacing:8px;font-size:22px;text-align:center}
  .banner{background:#E8F6EF;border:1px solid #bfe6d1;color:#14663f;border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:14px}
  .profile{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 24px}
  .profile div{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--grey)}
  .profile b{display:block;color:var(--ink);font-size:14px;word-break:break-all}
  h2{font-size:18px;margin:8px 0 12px}
  .bk{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .bk .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .bk h3{margin:0;font-size:16px;color:var(--navy)}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
  .badge.confirmed{background:#E8F6EF;color:var(--green)} .badge.pending{background:#FFF4E0;color:#B26A00}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;margin-top:12px;font-size:13px;color:var(--grey)}
  .grid b{color:var(--ink);display:block;font-size:14px}
  .empty{color:var(--grey);font-size:14px}
  .badge.paid{background:#E8F6EF;color:var(--green)} .badge.req{background:#FDECEA;color:#B42318} .badge.cancelled{background:#eee;color:#666}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .acts button,.acts a{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy);font:600 13px Poppins;cursor:pointer;text-decoration:none}
  .acts .pay{background:var(--orange);border-color:var(--orange);color:#fff}
  .req-box{margin-top:12px;display:none} .req-box textarea{width:100%;padding:10px;border:1px solid #cfd8e6;border-radius:10px;font:400 14px Poppins;min-height:70px}
  .req-box select{padding:9px;border-radius:9px;border:1px solid #cfd8e6;font:400 14px Poppins;margin-bottom:8px}
  .note{font-size:12px;color:var(--grey);margin-top:10px}
  @media(max-width:520px){.profile{grid-template-columns:1fr}}
</style>
<link rel="icon" href="/favicon.ico?v=3" sizes="48x48">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#043C87">
<!--seo-->
<meta name="robots" content="noindex, nofollow">
<!--/seo-->
</head>
<body>
<header><a href="../index.html"><img src="../assets/logo.png" alt="Trip Trek India"></a><a href="../index.html">← Back to site</a></header>
<main>
  <!-- LOGGED OUT -->
  <div class="card" id="authCard">
    <h1>My Account</h1>
    <p class="sub">Create an account or log in to see your bookings.</p>
    <div class="tabs"><button id="tabSignup" class="on" type="button">Create account</button><button id="tabLogin" type="button">Log in</button></div>

    <div id="stepDetails">
      <div id="signupOnly">
        <label for="name">Full name</label><input id="name" autocomplete="name" placeholder="Your name">
        <label for="phone">Mobile number</label><input id="phone" type="tel" autocomplete="tel" placeholder="10-digit mobile number">
      </div>
      <label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@email.com">
      <button class="btn" id="sendBtn" type="button">Send verification code</button>
    </div>

    <div id="stepOtp" class="hidden">
      <p class="sub" style="margin-top:0">We emailed a code to <b id="sentTo"></b>. Enter it below.</p>
      <label for="otp">Verification code</label><input id="otp" class="otp" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="••••••">
      <button class="btn" id="verifyBtn" type="button">Verify &amp; continue</button>
      <button class="link" id="backBtn" type="button">Use a different email</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <!-- LOGGED IN -->
  <div class="card hidden" id="dash">
    <div class="banner hidden" id="createdBanner">✅ Account created and verified with <b id="bEmail"></b><span id="bPhone"></span></div>
    <h1 id="hello">Welcome</h1>
    <p class="sub">Your account details and bookings.</p>
    <div class="profile">
      <div>Email<b id="pEmail"></b></div>
      <div>Mobile<b id="pPhone">—</b></div>
    </div>
    <div class="msg" id="msg2"></div>
    <h2>My bookings</h2>
    <div id="bookings"><p class="empty">Loading…</p></div>
    <button class="link" id="logout" type="button">Log out</button>
  </div>
</main>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  var $ = function(id){return document.getElementById(id)};
  var mode = 'signup', sb, justCreated = false;
  var inr = function(n){return '₹' + Number(n||0).toLocaleString('en-IN')};
  var esc = function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

  function say(t, kind){ var m=$($('dash').classList.contains('hidden')?'msg':'msg2'); m.className='msg '+(kind||'err'); m.textContent=t; if(!t) m.className='msg'; }

  try {
    var cfg = await (await fetch('/.netlify/functions/public-config')).json();
    sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  } catch(e){ say('Login is temporarily unavailable. Please try again shortly.'); return; }

  function setMode(m){
    mode = m;
    $('tabSignup').classList.toggle('on', m==='signup');
    $('tabLogin').classList.toggle('on', m==='login');
    $('signupOnly').classList.toggle('hidden', m!=='signup');
    $('sendBtn').textContent = m==='signup' ? 'Send verification code' : 'Send login code';
    say('');
  }
  $('tabSignup').onclick = function(){ setMode('signup') };
  $('tabLogin').onclick = function(){ setMode('login') };
  $('backBtn').onclick = function(){ $('stepOtp').classList.add('hidden'); $('stepDetails').classList.remove('hidden'); say(''); };

  $('sendBtn').onclick = async function(){
    var email = $('email').value.trim().toLowerCase();
    var name = $('name').value.trim();
    var phone = $('phone').value.replace(/\s|\+91/g,'');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return say('Please enter a valid email.');
    if(mode==='signup'){
      if(name.length<2) return say('Please enter your name.');
      if(!/^[6-9]\d{9}$/.test(phone)) return say('Please enter a valid 10-digit mobile number.');
    }
    this.disabled = true;
    var opts = { shouldCreateUser: true };
    if(mode==='signup') opts.data = { full_name: name, phone: phone };
    var r = await sb.auth.signInWithOtp({ email: email, options: opts });
    this.disabled = false;
    if(r.error){ console.error('OTP error', r.error); var m=(r.error.message||'').toLowerCase();
      return say(m.indexOf('rate')>-1 || r.error.status===429 ? 'Too many attempts. Please wait a few minutes and try again.' : 'Could not send the code (' + (r.error.message||'unknown error') + '). Please try again or contact us.'); }
    justCreated = (mode==='signup');
    $('sentTo').textContent = email;
    $('stepDetails').classList.add('hidden'); $('stepOtp').classList.remove('hidden');
    say('Code sent. Check your inbox (and spam folder).','ok');
  };

  $('verifyBtn').onclick = async function(){
    var email = $('sentTo').textContent, token = $('otp').value.trim();
    if(token.length<6) return say('Enter the code from your email.');
    this.disabled = true;
    var r = await sb.auth.verifyOtp({ email: email, token: token, type: 'email' });
    this.disabled = false;
    if(r.error) return say('That code is incorrect or has expired.');
    say(''); showDash(r.data.user, true);
  };

  $('logout').onclick = async function(){ await sb.auth.signOut(); location.reload(); };

  async function showDash(user, fresh){
    $('authCard').classList.add('hidden'); $('dash').classList.remove('hidden');
    var md = user.user_metadata || {};
    var email = user.email;
    $('hello').textContent = 'Hello' + (md.full_name ? ', ' + md.full_name.split(' ')[0] : '') + ' 👋';
    $('pEmail').textContent = email;

    var bk = await sb.from('bookings').select('*').order('created_at',{ascending:false});
    var rows = (bk.data||[]).filter(function(b){return b.status==='confirmed' || b.status==='pending'});
    var phone = md.phone || (rows[0] && rows[0].phone) || '';
    $('pPhone').textContent = phone ? '+91 ' + phone : '—';
    if(fresh && justCreated){
      $('createdBanner').classList.remove('hidden');
      $('bEmail').textContent = email;
      $('bPhone').textContent = phone ? ' and mobile +91 ' + phone : '';
    }
    window.__rows = rows;
    render();
  }

  function render(){
    var box = $('bookings'), rows = window.__rows || [];
    var order = {confirmed:0,pending:1};
    if(!rows.length){ box.innerHTML = '<p class="empty">No bookings yet. Pick a trip and reserve your seat — it will show up here.</p>'; return; }
    box.innerHTML = rows.slice().sort(function(a,b){return order[a.status]-order[b.status]}).map(function(b){
      var ok = b.status==='confirmed', paidFull = ok && !(b.balance_due>0);
      var badge = !ok ? ['pending','Payment pending'] : b.cancel_requested_at ? ['req','Request in progress'] : paidFull ? ['paid','Fully paid'] : ['confirmed','Booking confirmed'];
      var acts = '';
      if(ok){
        if(b.balance_due>0 && !b.cancel_requested_at) acts += '<button class="pay" data-a="pay" data-id="'+b.id+'">Pay balance '+inr(b.balance_due)+'</button>';
        acts += '<button data-a="receipt" data-id="'+b.id+'">Receipt</button>';
        acts += '<a href="/itineraries/'+encodeURIComponent(b.trek)+'.pdf" target="_blank" rel="noopener">Itinerary PDF</a>';
        acts += '<button data-a="req" data-id="'+b.id+'">Change / cancel</button>';
      }
      var reqBox = ok ? '<div class="req-box" id="rb-'+b.id+'"><select id="rt-'+b.id+'"><option value="change">Change my date / details</option><option value="cancel">Cancel my booking</option></select>'
        + '<textarea id="rm-'+b.id+'" placeholder="Tell us what you need…"></textarea><div class="acts"><button class="pay" data-a="sendreq" data-id="'+b.id+'">Send request</button></div>'
        + '<div class="note">Refunds follow our <a href="/refund-policy.html">refund policy</a>. Our team will contact you.</div></div>' : '';
      return '<div class="bk"><div class="top"><h3>'+esc(b.trek_name||b.trek)+'</h3><span class="badge '+badge[0]+'">'+badge[1]+'</span></div>'
        + '<div class="grid">'
        + '<div>Travellers<b>'+esc(b.travellers)+' ('+esc(b.sharing)+' sharing)</b></div>'
        + '<div>Preferred date<b>'+esc(b.travel_date||'To be confirmed')+'</b></div>'
        + '<div>Advance paid<b>'+inr(b.advance_paid)+'</b></div>'
        + '<div>'+(paidFull?'Balance paid':'Balance due')+'<b>'+(paidFull?inr(b.balance_paid_amount):inr(b.balance_due))+'</b></div>'
        + '<div>Total<b>'+inr(b.total_amount)+'</b></div>'
        + '<div>Payment ID<b>'+esc(b.razorpay_payment_id||'—')+'</b></div>'
        + '</div>' + (b.cancel_requested_at ? '<div class="note">Your request has been sent to our team.</div>' : '') + '<div class="acts">'+acts+'</div>' + reqBox + '</div>';
    }).join('');
  }

  async function token(){ var s=await sb.auth.getSession(); return s.data.session && s.data.session.access_token; }
  async function api(fn, body){
    var r = await fetch('/.netlify/functions/'+fn,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await token()},body:JSON.stringify(body)});
    var d = await r.json().catch(function(){return {}}); if(!r.ok) throw new Error(d.error||'Something went wrong'); return d;
  }
  async function reload(){
    var bk = await sb.from('bookings').select('*').order('created_at',{ascending:false});
    window.__rows = (bk.data||[]).filter(function(b){return b.status==='confirmed'||b.status==='pending'}); render();
  }
  function receipt(b){
    var w = window.open('','_blank'); if(!w) return alert('Please allow pop-ups to view the receipt.');
    var paidBal = b.balance_paid_amount||0, paid = (b.advance_paid||0)+paidBal;
    w.document.write('<title>Receipt</title><body style="font-family:Arial;max-width:640px;margin:30px auto;color:#13243C"><h2 style="color:#043C87;margin-bottom:0">Trip Trek India</h2><div style="color:#5A6B80;font-size:13px">Hitman Digital Pvt. Ltd. · triptrekindia.in · +91 93109 65771</div><hr><h3>Payment receipt</h3>'
     +'<table style="width:100%;font-size:14px;border-collapse:collapse">'
     +[['Name',b.name],['Email',b.email],['Trip',b.trek_name],['Travellers',b.travellers+' ('+b.sharing+' sharing)'],['Preferred date',b.travel_date||'To be confirmed'],['Trip total',inr(b.total_amount)],['Advance paid',inr(b.advance_paid)+' (ID '+(b.razorpay_payment_id||'-')+')'],['Balance paid',paidBal?inr(paidBal)+' (ID '+(b.balance_payment_id||'-')+')':'—'],['Total received',inr(paid)],['Balance remaining',inr(b.balance_due)]]
       .map(function(r){return '<tr><td style="padding:7px 0;border-bottom:1px solid #eee;color:#5A6B80">'+r[0]+'</td><td style="text-align:right;border-bottom:1px solid #eee"><b>'+esc(r[1])+'</b></td></tr>'}).join('')
     +'</table><p style="font-size:12px;color:#5A6B80">Booking ref: '+esc(b.id)+'. This is a computer-generated receipt.</p><p><button onclick="print()">Print / Save as PDF</button></p></body>');
    w.document.close();
  }
  $('bookings').addEventListener('click', async function(e){
    var el = e.target.closest('[data-a]'); if(!el) return;
    var id = el.getAttribute('data-id'), a = el.getAttribute('data-a');
    var b = (window.__rows||[]).filter(function(x){return String(x.id)===id})[0]; if(!b) return;
    try{
      if(a==='receipt') return receipt(b);
      if(a==='req'){ var rb=$('rb-'+id); rb.style.display = rb.style.display==='block'?'none':'block'; return; }
      if(a==='sendreq'){
        el.disabled = true;
        await api('booking-request',{booking_id:b.id,type:$('rt-'+id).value,message:$('rm-'+id).value});
        say('Request sent. Our team will contact you shortly.','ok'); await reload(); return;
      }
      if(a==='pay'){
        el.disabled = true;
        var o = await api('create-balance-order',{booking_id:b.id});
        new Razorpay({
          key:o.key, amount:o.amount, currency:'INR', order_id:o.order_id, name:'Trip Trek India', description:'Balance — '+o.trek_name,
          prefill:{name:o.name,email:o.email,contact:o.phone}, theme:{color:'#043C87'},
          handler: async function(resp){
            try{ var r = await fetch('/.netlify/functions/verify-balance-payment',{method:'POST',body:JSON.stringify(resp)}); if(!r.ok) throw 0; say('Payment received. Thank you!','ok'); }
            catch(_){ say('Payment received — it will show here in a moment.','ok'); }
            setTimeout(reload,1500);
          },
          modal:{ondismiss:function(){el.disabled=false}}
        }).open();
      }
    }catch(err){ say(err.message); el.disabled=false; }
  });

  var s = await sb.auth.getSession();
  if(s.data.session) showDash(s.data.session.user, false);
})();
</script>
</body>
</html>
